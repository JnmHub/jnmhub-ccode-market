interface:
  display_name: "Android 逆向"
  short_description: "授权 Android 应用逆向：最短流程、按需参考与证据化总结"
  default_prompt: "使用 android-reverse 处理用户授权范围内的 Android 应用分析任务，只在授权与安全边界内工作，不替换成更容易的目标。先读 docs/reference/reverse-bootstrap.md 确认目标、边界与首读协议；其余参考按当前问题选读：工作推进 docs/reference/reverse-workflow.md、安全边界 docs/reference/case-safety-policy.md、专题导航 references/topic-playbook-index.md。记录证据时区分用户提供、静态推断、实际执行与未验证；在有意义的结论、路线变化、暂停或交接时更新 report.md，可随时汇报未完成、等待输入与未测范围。report.md 是唯一必需管理总结，真实代码、日志、样本、图表与用户指定成果按需生成保留，无固定标题或状态表门禁，不要求补齐历史 task/state/template 文件。task-init 仅为可选创建辅助（node <SKILL_BASE>/tools/task/task-init.mjs <task-id> --goal=... --boundary=...），脚本不可用可手工创建 report，不决定是否可以汇报。声明完成前的唯一例外：按 references/completion-gate-checklist.md 逐项核对用户要求、实际产物与验证证据，未测项保持未测。Frida 动态任务先核对版本（基准 17.6.2 / legacy 16.5-16.8，见 references/frida-version-policy.md）。Windows 宿主执行命令遵循 references/windows-command-safety.md：bash 优先，PowerShell 仅以 -NoProfile -ExecutionPolicy Bypass -File 运行脚本、禁止 -Command 内联，含中文或混合编码的长输出先落盘再读。破坏性或不可逆操作按 case-safety-policy 确认清单先说明影响并取得用户同意；用户明确禁止的方法不自行复活。"
